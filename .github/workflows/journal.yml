name: Trade Marks Journal

on:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'   # every 4 hours until the 2-year backlog is read; then it finds nothing new and stops in a minute
  workflow_dispatch:
    inputs:
      test:
        description: 'Only test IP India access (no data saved)'
        type: boolean
        default: false
      debug:
        description: 'Journal number to dump page text (for fixing the reader)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - name: PHP and OCR
        run: |
          php -v && php -m | grep -E -i 'curl|mbstring|zlib'
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr >/dev/null && tesseract --version | head -1
      - name: Test IP India access
        if: ${{ inputs.test }}
        run: php scripts/run.php --test
      - name: Debug a journal
        if: ${{ inputs.debug != '' && inputs.debug != null }}
        env:
          TMJ_DEBUG: ${{ inputs.debug }}
        run: |
          php scripts/run.php
          git config user.name "journal-robot"
          git config user.email "journal-robot@users.noreply.github.com"
          git add debug && git commit -m "debug ${{ inputs.debug }}" && git pull --rebase --quiet && git push
      - name: Read new journals
        if: ${{ !inputs.test && (inputs.debug == '' || inputs.debug == null) }}
        run: php scripts/run.php
      - name: Save data
        if: ${{ !inputs.test && (inputs.debug == '' || inputs.debug == null) }}
        run: |
          git config user.name "journal-robot"
          git config user.email "journal-robot@users.noreply.github.com"
          git add data
          git commit -m "Journal data $(date -u +%Y-%m-%d)" || echo "nothing new"
          git pull --rebase --quiet || true
          git push
